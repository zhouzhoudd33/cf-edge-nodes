name: update-nodes

on:
  schedule:
    # UTC 00:00 / 12:00  →  北京时间 08:00 / 20:00，每天两次
    - cron: '0 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-nodes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 生成节点表（拉取 + TLS 实测验证）
        run: node scripts/update-nodes.mjs nodes.txt meta.json

      - name: 提交变更
        run: |
          git config user.name  "cf-edge-nodes-bot"
          git config user.email "cf-edge-nodes-bot@users.noreply.github.com"
          git add nodes.txt meta.json
          if git diff --cached --quiet; then
            echo "本次无变化，跳过提交"
          else
            git commit -m "chore: 更新节点表 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: 汇总
        run: |
          echo "### 节点表已更新" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat meta.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
